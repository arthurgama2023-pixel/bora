name: KegControl Carrinho Abandonado (5min)

# Dispara o agente de recuperação, sozinho, pra quem preencheu o checkout no
# site e não finalizou — parado há mais de `idle` minutos (folga). Espelha o
# keep-alive: cron do GitHub batendo no endpoint público do Render.

on:
  schedule:
    # A cada 5 minutos (o GitHub pode atrasar em horários de pico).
    - cron: "*/5 * * * *"
  # Permite rodar manualmente pela UI do Actions.
  workflow_dispatch:

# Evita acúmulo de execuções se uma demorar.
concurrency:
  group: kegcontrol-carrinho-abandonado
  cancel-in-progress: true

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Varre carrinho abandonado e dispara recuperação
        run: |
          curl -fsS -m 90 --retry 2 --retry-delay 10 \
            "https://kegcontrol.onrender.com/api/cron/disparar-carrinho?idle=5" \
            || echo "varredura falhou (serviço pode estar acordando) — próxima rodada tenta de novo"
